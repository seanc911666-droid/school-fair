<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>園遊會美食線上預購</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800">

  <nav class="bg-indigo-600 text-white p-4 shadow-lg flex justify-between items-center">
    <h1 class="text-xl font-bold">🎪 園遊會美食預購系統</h1>
    <button onclick="toggleAdmin()" class="bg-indigo-800 px-3 py-1 rounded text-sm hover:bg-indigo-900">
      管理員入口
    </button>
  </nav>

  <div class="max-w-md mx-auto p-4 space-y-4">

    <!-- 顧客端 (免登入) -->
    <div id="customer-view" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow">
        <h2 class="text-lg font-bold mb-2">1. 預購人資訊</h2>
        <div class="space-y-3">
          <div>
            <label class="text-sm font-medium">班級 (必填)</label>
            <input type="text" id="cust-class" placeholder="例：高一 3 班" class="w-full border p-2 rounded mt-1">
          </div>
          <div>
            <label class="text-sm font-medium">姓名與座號 (必填)</label>
            <input type="text" id="cust-name" placeholder="例：王小明 15號" class="w-full border p-2 rounded mt-1">
          </div>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow">
        <h2 class="text-lg font-bold mb-3">2. 選擇商品</h2>
        
        <div class="space-y-3">
          <!-- 糖葫蘆 -->
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <p class="font-bold">🍓 糖葫蘆</p>
              <p class="text-sm text-slate-500">$40 / 支</p>
            </div>
            <input type="number" id="item-tanghulu" value="0" min="0" onchange="calculateTotal()" class="w-16 border text-center p-1 rounded">
          </div>

          <!-- 香腸 -->
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <p class="font-bold">🌭 香腸</p>
              <p class="text-sm text-slate-500">$45 / 支</p>
            </div>
            <input type="number" id="item-sausage" value="0" min="0" onchange="calculateTotal()" class="w-16 border text-center p-1 rounded">
          </div>

          <!-- 花生捲冰淇淋 -->
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <p class="font-bold">🍦 花生捲冰淇淋</p>
              <p class="text-sm text-slate-500">$50 / 份</p>
            </div>
            <input type="number" id="item-icecream" value="0" min="0" onchange="calculateTotal()" class="w-16 border text-center p-1 rounded">
          </div>

          <!-- 冰島包(大) -->
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <p class="font-bold">👜 冰島包 (大)</p>
              <p class="text-sm text-slate-500">$150 / 個</p>
            </div>
            <input type="number" id="item-bag-large" value="0" min="0" onchange="calculateTotal()" class="w-16 border text-center p-1 rounded">
          </div>

          <!-- 冰島包(小) -->
          <div class="flex justify-between items-center border-b pb-2">
            <div>
              <p class="font-bold">👝 冰島包 (小)</p>
              <p class="text-sm text-slate-500">$100 / 個</p>
            </div>
            <input type="number" id="item-bag-small" value="0" min="0" onchange="calculateTotal()" class="w-16 border text-center p-1 rounded">
          </div>
        </div>

        <div class="mt-4 pt-2 border-t flex justify-between items-center font-bold text-lg">
          <span>總金額：</span>
          <span class="text-indigo-600">$<span id="total-display">0</span></span>
        </div>

        <button id="submit-btn" onclick="submitOrder()" class="w-full mt-4 bg-indigo-600 text-white font-bold py-3 rounded-xl shadow hover:bg-indigo-700">
          送出預購單
        </button>
      </div>
    </div>

    <!-- 管理員端 -->
    <div id="admin-view" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow">
        <h2 class="text-lg font-bold mb-2">🔒 管理員後台</h2>
        <div id="login-box" class="space-y-2">
          <input type="password" id="admin-pass" placeholder="請輸入管理員密碼" class="w-full border p-2 rounded">
          <button onclick="loginAdmin()" class="w-full bg-emerald-600 text-white py-2 rounded font-bold">登入驗證</button>
        </div>
        
        <div id="admin-content" class="hidden">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold">所有預購訂單</h3>
            <button onclick="loadOrders()" class="text-xs bg-slate-200 px-2 py-1 rounded">重新整理</button>
          </div>
          <div id="orders-list" class="space-y-2 text-sm"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ⚠️ 請替換成你部署 Google Apps Script 後取得的 Web 應用程式網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyNuz-DGFErWbG-eJWiq0_ze1Xun1sN2erfiNZf8XkimQ7zINQRpDP5V0taxE_K2eGL/exec";

    function calculateTotal() {
      const tanghulu = (parseInt(document.getElementById('item-tanghulu').value) || 0) * 40;
      const sausage = (parseInt(document.getElementById('item-sausage').value) || 0) * 45;
      const icecream = (parseInt(document.getElementById('item-icecream').value) || 0) * 50;
      const bagLarge = (parseInt(document.getElementById('item-bag-large').value) || 0) * 150;
      const bagSmall = (parseInt(document.getElementById('item-bag-small').value) || 0) * 100;
      
      const total = tanghulu + sausage + icecream + bagLarge + bagSmall;
      document.getElementById('total-display').innerText = total;
      return total;
    }

    async function submitOrder() {
      const className = document.getElementById('cust-class').value.trim();
      const name = document.getElementById('cust-name').value.trim();
      
      const tanghulu = parseInt(document.getElementById('item-tanghulu').value) || 0;
      const sausage = parseInt(document.getElementById('item-sausage').value) || 0;
      const icecream = parseInt(document.getElementById('item-icecream').value) || 0;
      const bagLarge = parseInt(document.getElementById('item-bag-large').value) || 0;
      const bagSmall = parseInt(document.getElementById('item-bag-small').value) || 0;
      
      const total = calculateTotal();

      if (!className || !name) {
        alert('請填寫班級與姓名！');
        return;
      }
      if (total === 0) {
        alert('請至少選擇一種商品！');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = '傳送訂單中...';

      const payload = {
        action: "addOrder",
        className: className,
        name: name,
        tanghulu: tanghulu,
        sausage: sausage,
        icecream: icecream,
        bagLarge: bagLarge,
        bagSmall: bagSmall,
        totalPrice: total
      };

      try {
        await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        alert('預購成功！資料已寫入試算表。');
        document.getElementById('cust-class').value = '';
        document.getElementById('cust-name').value = '';
        document.getElementById('item-tanghulu').value = '0';
        document.getElementById('item-sausage').value = '0';
        document.getElementById('item-icecream').value = '0';
        document.getElementById('item-bag-large').value = '0';
        document.getElementById('item-bag-small').value = '0';
        calculateTotal();
      } catch (err) {
        alert('送出失敗，請重試：' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '送出預購單';
      }
    }

    function toggleAdmin() {
      document.getElementById('customer-view').classList.toggle('hidden');
      document.getElementById('admin-view').classList.toggle('hidden');
    }

    function loginAdmin() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === 'admin888') { // 後台密碼
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        loadOrders();
      } else {
        alert('密碼錯誤！');
      }
    }

    async function loadOrders() {
      const listDiv = document.getElementById('orders-list');
      listDiv.innerHTML = '資料載入中...';

      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();
        listDiv.innerHTML = '';
        
        if (data.length === 0) {
          listDiv.innerHTML = '目前無預購訂單';
          return;
        }

        data.forEach(item => {
          let itemsText = [];
          if (item.tanghulu > 0) itemsText.push(`糖葫蘆 x${item.tanghulu}`);
          if (item.sausage > 0) itemsText.push(`香腸 x${item.sausage}`);
          if (item.icecream > 0) itemsText.push(`花生捲冰淇淋 x${item.icecream}`);
          if (item.bagLarge > 0) itemsText.push(`冰島包(大) x${item.bagLarge}`);
          if (item.bagSmall > 0) itemsText.push(`冰島包(小) x${item.bagSmall}`);

          listDiv.innerHTML += `
            <div class="border p-2 rounded bg-slate-50">
              <div class="font-bold text-indigo-600">${item.className} - ${item.name}</div>
              <div class="text-slate-700">${itemsText.join(' | ')}</div>
              <div class="text-xs text-slate-500 justify-between flex mt-1">
                <span class="font-bold text-emerald-600">總計: $${item.totalPrice}</span>
                <span>${item.time}</span>
              </div>
            </div>
          `;
        });
      } catch (err) {
        listDiv.innerHTML = '載入失敗：' + err.message;
      }
    }
  </script>
</body>
</html>
